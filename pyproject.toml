[project]
name = "blockcode"
version = "0.1.0"
description = "Scratch-style blocks for learning SQL, Python (pandas) and R (dplyr)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "saf-azad" }]
keywords = ["education", "visual-programming", "sql", "pandas", "dplyr", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "sqlglot>=25",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://blockcode-psi.vercel.app"
Repository = "https://github.com/saf-azad/BlockCode"
Documentation = "https://github.com/saf-azad/BlockCode/blob/main/docs/ARCHITECTURE.md"

[project.scripts]
blockcode = "blockcode.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blockcode"]

[tool.vercel]
# Vercel looks for a FastAPI `app` in app.py / main.py / index.py by default; ours is here.
entrypoint = "blockcode.server:app"

[tool.vercel.scripts]
# Build the web editor into public/, which Vercel serves from its CDN.
build = "npm --prefix web ci && npm --prefix web run build -- --outDir ../public --emptyOutDir"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # long lines: left to judgement (generated-code templates read better unwrapped)
    "B905",   # zip(strict=...) would change behaviour, not just style
    "UP031",  # the runner harnesses are %-formatted so the R/Python braces inside stay literal
    "SIM300", # Pratt-parser binding powers read naturally as `BP > min_bp`
    "SIM905", # the SQL reserved-word list is clearer as one string than a 100-item literal
    "UP035",  # typing.Callable and friends still work; not worth the churn on its own
]

[tool.ruff.lint.per-file-ignores]
# The `kind` lambda is only called within the loop iteration that defines it.
"blockcode/run/r_runner.py" = ["B023"]

[tool.ruff.lint.flake8-bugbear]
# Typer and FastAPI declare parameters with calls in defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.File", "fastapi.Form"]
