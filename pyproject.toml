[project]
name = "blockcode"
version = "0.1.0"
description = "Scratch-style blocks for learning SQL, Python (pandas) and R (dplyr)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "sqlglot>=25",
    "python-multipart>=0.0.9",
]

[project.scripts]
blockcode = "blockcode.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blockcode"]

[tool.vercel]
# Vercel looks for a FastAPI `app` in app.py / main.py / index.py by default; ours is here.
entrypoint = "blockcode.server:app"

[tool.vercel.scripts]
# Build the web editor into public/, which Vercel serves from its CDN.
build = "npm --prefix web ci && npm --prefix web run build -- --outDir ../public --emptyOutDir"

[tool.pytest.ini_options]
testpaths = ["tests"]
