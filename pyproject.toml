[project]
name = "blockcode"
version = "0.1.0"
description = "Scratch-style blocks for learning SQL, Python (pandas) and R (dplyr)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "sqlglot>=25",
    "python-multipart>=0.0.9",
]

[project.scripts]
blockcode = "blockcode.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blockcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
